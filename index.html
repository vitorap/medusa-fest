<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d1a;color:#e0e0e0;font-family:-apple-system,system-ui,sans-serif;padding:16px;min-height:100vh}
h1{color:#bb86fc;text-align:center;font-size:20px;letter-spacing:2px;margin-bottom:4px}
.sub{color:#9e9e9e;text-align:center;font-size:12px;letter-spacing:3px;margin-bottom:16px}
.tabs{display:flex;gap:0;margin-bottom:12px;border-radius:8px;overflow:hidden}
.tab{flex:1;padding:10px;text-align:center;background:#16213e;color:#9e9e9e;border:none;font-size:13px;font-weight:bold;cursor:pointer}
.tab.active{color:#bb86fc;border-bottom:3px solid #bb86fc}
.nav{display:flex;gap:8px;margin-bottom:16px}
.btn{flex:1;padding:10px;background:#1a1a2e;color:#bb86fc;border:1px solid #bb86fc33;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;text-align:center}
.card{border-radius:12px;padding:14px;margin-bottom:10px}
.card.rage{background:#1a0a0a;border:1px solid #ff444444}
.card.kodama{background:#0a1a0f;border:1px solid #00e67644}
.card.tortuga{background:#1a150a;border:1px solid #ffab0044}
.card .name{font-size:15px;font-weight:bold}
.card.rage .name{color:#ff6b6b}
.card.kodama .name{color:#69f0ae}
.card.tortuga .name{color:#ffd740}
.card .time{font-size:12px;margin-top:2px}
.card.rage .time{color:#993333}
.card.kodama .time{color:#338855}
.card.tortuga .time{color:#997722}
.card .desc{color:#9e9e9e;font-size:12px;margin-top:4px}
.card .countdown{color:#bb86fc;font-size:11px;margin-top:6px;font-weight:bold}
.card .next{color:#9e9e9e;font-size:12px;margin-top:8px}
.day-header{color:#9e9e9e;text-align:center;font-size:13px;font-weight:bold;letter-spacing:2px;padding:16px 0 8px}
.now-badge{color:#bb86fc;font-size:10px;font-weight:bold;letter-spacing:1px;margin-top:6px}
.card.current{opacity:1}
.card:not(.current){opacity:0.7}
#lineup{display:none}
</style>
</head>
<body>

<div class="sub">BRASIL 2026</div>

<div class="nav">
<div class="btn" onclick="showHome()">NOW PLAYING</div>
<div class="btn" onclick="showLineup()">FULL LINEUP</div>
</div>

<div id="home"></div>

<div class="tab active" onclick="switchTab('Rage',this)">Rage</div>
<div class="tab" onclick="switchTab('Kodama',this)">Kodama</div>
<div class="tab" onclick="switchTab('Tortuga',this)">Tortuga</div>
</div>
<div class="btn" onclick="jumpToNow()" style="margin-bottom:12px">⚡ JUMP TO NOW</div>
<div id="lineup-content"></div>
</div>

function mins(a){return a[1]*24*60+a[2]*60+a[3]}
function fmt(h,m){return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function fmtTime(a){
  const sa=L.filter(x=>x[0]===a[0]).sort((x,y)=>mins(x)-mins(y));
  const i=sa.indexOf(a);
  const end=i<sa.length-1?fmt(sa[i+1][2],sa[i+1][3]):'END';
  return fmt(a[2],a[3])+'-'+end;
}
function getNow(){const d=new Date();return d.getDate()*24*60+d.getHours()*60+d.getMinutes()}

let favs=JSON.parse(localStorage.getItem('favs')||'{}');
function toggleFav(name){favs[name]=!favs[name];if(!favs[name])delete favs[name];localStorage.setItem('favs',JSON.stringify(favs))}

function showHome(){
  document.getElementById('home').style.display='block';
  document.getElementById('lineup').style.display='none';
  renderHome();
}
function showLineup(){
  document.getElementById('home').style.display='none';
  document.getElementById('lineup').style.display='block';
  renderLineup(currentTab);
}

function renderHome(){
  const now=getNow();
  let html='';
  ['Rage','Kodama','Tortuga'].forEach(stage=>{
    const acts=L.filter(a=>a[0]===stage);
    const cur=acts.filter(a=>mins(a)<=now).sort((a,b)=>mins(b)-mins(a))[0];
    const cls=stage.toLowerCase();
    if(!cur){html+=`<div class="card ${cls}"><div class="name">🎵 ${stage} Stage</div><div class="desc">No act playing yet</div></div>`;return}
    const sa=acts.sort((a,b)=>mins(a)-mins(b));
    const i=sa.indexOf(cur);
    const next=i<sa.length-1?sa[i+1]:null;
    const endMin=next?mins(next):mins(cur)+120;
    const rem=endMin-now;
    const fav=favs[cur[4]]?' ⭐':'';
    const nextInfo=next?`<div class="next">⏭ Next: ${next[4]} at ${fmt(next[2],next[3])}</div>`:'';
    html+=`<div class="card ${cls} current"><div class="name">🎵 ${stage} Stage</div><div class="name" style="margin-top:8px">${cur[4]}${fav}  [${fmtTime(cur)}]</div><div class="countdown">⏱ ${rem>0?rem+'min left':'ending'}</div><div class="desc">${cur[5]}</div>${nextInfo}</div>`;
  });
  document.getElementById('home').innerHTML=html;
}

let currentTab='Rage';
function switchTab(stage,el){
  currentTab=stage;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderLineup(stage);
}

let nowEl=null;
function renderLineup(stage){
  const now=getNow();
  const acts=L.filter(a=>a[0]===stage).sort((a,b)=>mins(a)-mins(b));
  const cur=acts.filter(a=>mins(a)<=now).sort((a,b)=>mins(b)-mins(a))[0];
  const cls=stage.toLowerCase();
  let html='';let lastDay=-1;
  acts.forEach(a=>{
    if(a[1]!==lastDay){lastDay=a[1];const dn={15:'FRIDAY',16:'SATURDAY',17:'SUNDAY',18:'MONDAY'}[a[1]];html+=`<div class="day-header">— ${dn} —</div>`}
    const isCur=cur&&a===cur;
    const fav=favs[a[4]]?'⭐ ':'';
    html+=`<div class="card ${cls} ${isCur?'current':''}" ${isCur?'id="now-card"':''} onclick="onTap('${a[4].replace(/'/g,"\\'")}','${stage}')"><div class="name">${fav}${a[4]}</div><div class="time">${fmtTime(a)}</div><div class="desc">${a[5]}</div>${isCur?'<div class="now-badge">▶ NOW PLAYING</div>':''}</div>`;
  });
  document.getElementById('lineup-content').innerHTML=html;
}

function onTap(name,stage){
  toggleFav(name);
  const msg=favs[name]?`⭐ ${name} — favorited`:`Removed ${name}`;
  showToast(msg);
  renderLineup(stage);
}

function jumpToNow(){const el=document.getElementById('now-card');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}

function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  Object.assign(t.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'#1a1a2e',color:'#bb86fc',padding:'10px 20px',borderRadius:'8px',fontSize:'13px',zIndex:999,border:'1px solid #bb86fc33'});
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

showHome();
setInterval(renderHome,30000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
