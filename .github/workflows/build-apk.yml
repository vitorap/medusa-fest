name: Build Medusa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Medusa-Fest-2026-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Medusa-Fest-2026-APK
          path: Medusa-Fest-2026-debug.apk
          if-no-files-found: error
          retention-days: 30
